<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
    <!-- Gradient Background Badge -->
    <defs>
        <linearGradient id="trekBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0d9488" />
            <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>
        <linearGradient id="peakFront" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#e0f2fe" />
        </linearGradient>
        <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="100%" stop-color="#f59e0b" />
        </linearGradient>
    </defs>
    
    <!-- Rounded Container -->
    <rect width="48" height="48" rx="14" fill="url(#trekBg)"/>
    
    <!-- Sun / Compass Glow -->
    <circle cx="24" cy="16" r="6" fill="url(#sunGrad)"/>
    
    <!-- Back Mountain Peak -->
    <polygon points="12,36 21,21 30,36" fill="#0f766e" opacity="0.85"/>
    <polygon points="21,21 24,26 21,28 18,26" fill="#ccfbf1" opacity="0.6"/>

    <!-- Front Majestic Mountain Peak -->
    <polygon points="20,38 32,18 44,38" fill="url(#peakFront)"/>
    
    <!-- Front Peak Snow Cap Shadow -->
    <polygon points="32,18 36,24 33,27 28,24" fill="#bae6fd"/>

    <!-- Trail Path / Horizon Wave -->
    <path d="M6 38 C 16 34, 30 40, 42 37" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
</svg>
