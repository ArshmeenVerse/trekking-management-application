{% extends "base.html" %}

{% block title %}
Admin Dashboard
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2 class="mb-0">
        Admin Dashboard
    </h2>

</div>


<div class="row mb-4">

    <div class="col-md-3 mb-3">
        <div class="card text-center shadow-sm">

            <div class="card-body">

                <h5>Total Treks</h5>

                <h2 class="text-primary">
                    {{ total_treks }}
                </h2>

            </div>

        </div>
    </div>


    <div class="col-md-3 mb-3">
        <div class="card text-center shadow-sm">

            <div class="card-body">

                <h5>Total Bookings</h5>

                <h2 class="text-primary">
                    {{ total_bookings }}
                </h2>

            </div>

        </div>
    </div>


    <div class="col-md-3 mb-3">
        <div class="card text-center shadow-sm">

            <div class="card-body">

                <h5>Total Users</h5>

                <h2 class="text-primary">
                    {{ total_users }}
                </h2>

            </div>

        </div>
    </div>


    <div class="col-md-3 mb-3">
        <div class="card text-center shadow-sm">

            <div class="card-body">

                <h5>Total Staff</h5>

                <h2 class="text-primary">
                    {{ total_staff }}
                </h2>

            </div>

        </div>
    </div>

</div>

{% endblock %}
