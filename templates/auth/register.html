{% extends "base.html" %}

{% block title %}
Register - Trekking Management
{% endblock %}

{% block content %}

<div class="row justify-content-center py-4">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='images/logo.svg') }}"
                         alt="Trekking Management"
                         width="56"
                         height="56"
                         class="mb-3 shadow-sm rounded-3">
                    <h3 class="fw-bold mb-1">Create an Account</h3>
                    <p class="text-muted small">Register as a trekker or trek staff member</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Your full name"
                            required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email Address</label>
                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="name@example.com"
                                required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone Number</label>
                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                placeholder="Phone number"
                                required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Password</label>
                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="••••••••"
                                required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control"
                                placeholder="••••••••"
                                required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">I am a</label>
                        <select
                            name="role"
                            class="form-select"
                            required>
                            <option value="" disabled selected>-- Select Role --</option>
                            <option value="trekker">Trekker (Explore & Book)</option>
                            <option value="staff">Trek Staff (Guide & Manage)</option>
                        </select>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg">
                            Register
                        </button>
                    </div>
                </form>

                <div class="text-center pt-3 border-top">
                    <p class="text-muted small mb-0">
                        Already have an account?
                        <a href="{{ url_for('auth.login') }}" class="text-success fw-bold text-decoration-none">
                            Login here
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
