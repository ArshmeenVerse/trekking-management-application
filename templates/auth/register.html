{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="text-center mb-4">
                    Create Account
                </h2>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">I am a</label>

                        <select
                            name="role"
                            class="form-select"
                            required>

                            <option value="">-- Select Role --</option>
                            <option value="trekker">Trekker</option>
                            <option value="staff">Trek Staff</option>

                        </select>
                    </div>

                    <div class="d-grid">
                        <button
                            type="submit"
                            class="btn btn-success">
                            Register
                        </button>
                    </div>

                </form>

                <hr>

                <p class="text-center mb-0">
                    Already have an account?
                    <a href="{{ url_for('auth.login') }}">
                        Login here
                    </a>
                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
