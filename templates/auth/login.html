{% extends "base.html" %}

{% block title %}
Login - Trekking Management
{% endblock %}

{% block content %}

<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='images/logo.svg') }}"
                         alt="Trekking Management"
                         width="56"
                         height="56"
                         class="mb-3 shadow-sm rounded-3">
                    <h3 class="fw-bold mb-1">Welcome Back</h3>
                    <p class="text-muted small">Sign in to your Trekking Management account</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="name@example.com"
                            required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="••••••••"
                            required>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg">
                            Login
                        </button>
                    </div>
                </form>

                <div class="text-center pt-3 border-top">
                    <p class="text-muted small mb-0">
                        Don't have an account?
                        <a href="{{ url_for('auth.register') }}" class="text-success fw-bold text-decoration-none">
                            Register here
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
