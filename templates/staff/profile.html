{% extends "base.html" %}

{% block title %}
My Profile
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2 class="mb-0">
        My Profile
    </h2>

    <a href="{{ url_for('staff.staff_dashboard') }}"
       class="btn btn-outline-secondary">
        Dashboard
    </a>

</div>

<div class="card shadow-sm">

    <div class="card-header bg-primary text-white">

        <h5 class="mb-0">
            Update Profile
        </h5>

    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ user.name }}"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    value="{{ user.email }}"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Phone Number
                </label>

                <input
                    type="text"
                    name="phone"
                    class="form-control"
                    value="{{ user.phone }}"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-primary">
                Update Profile
            </button>

        </form>

    </div>

</div>

{% endblock %}
